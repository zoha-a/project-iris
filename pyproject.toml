[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iris-ingest"
version = "0.1.0"
description = "Reusable source adapter contract for Project IRIS ingestion"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
iris-ingest = "iris_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
